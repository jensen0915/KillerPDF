name: Build Release (fork)

# jensen0915/KillerPDF only. Upstream releases are signed and packaged by release.ps1; this fork
# has no code-signing certificate, so it builds upstream's single-file portable edition unsigned.
on:
  push:
    tags:
      - "v*-office-ux*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update, e.g. v1.8.91-office-ux"
        required: true

permissions:
  contents: write

jobs:
  build:
    if: github.repository != 'SteveTheKiller/KillerPDF'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Test
        run: |
          # WPF FontCache requires WINDIR even for isolated resource tests.
          if (!$env:WINDIR) { $env:WINDIR = $env:SYSTEMROOT }
          $results = Join-Path $env:RUNNER_TEMP 'test-results'
          $failed = @()
          foreach ($project in 'KillerPDF.Tests/KillerPDF.Tests.csproj',
                               'engine/KillerPdf.Engine.Tests/KillerPdf.Engine.Tests.csproj') {
            dotnet test $project -c Release --logger trx --results-directory $results
            if ($LASTEXITCODE -ne 0) { $failed += $project }
          }
          # Run logs need a sign-in to read; annotations are public, so name each failing test there.
          function Escape([string]$text, [switch]$Property) {
            $text = $text -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            if ($Property) { $text = $text -replace ':', '%3A' -replace ',', '%2C' }
            $text
          }
          foreach ($trx in Get-ChildItem $results -Filter *.trx -ErrorAction SilentlyContinue) {
            [xml]$run = Get-Content -Raw $trx.FullName
            foreach ($result in @($run.TestRun.Results.UnitTestResult) | Where-Object outcome -eq 'Failed') {
              $info = $result.Output.ErrorInfo
              $where = "$($info.StackTrace)".Trim() -split "`r?`n" | Select-Object -First 1
              $message = "$($info.Message)".Trim()
              if ($message.Length -gt 900) { $message = $message.Substring(0, 900) + '...' }
              Write-Output "::error title=$(Escape $result.testName -Property)::$(Escape "$message`n$where")"
            }
          }
          if ($failed) {
            Write-Output "::error title=Tests failed::$(Escape ($failed -join ', '))"
            throw "Tests failed: $($failed -join ', ')"
          }

      # Upstream's packager: a self-contained loose payload (startup-checked and hash-manifested),
      # compressed into one KillerPDF-Portable.exe launcher. Unsigned, since -RequireSignature is off.
      - name: Build portable EXE
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          ./build/build-portable.ps1 -PackageKind Portable

      - name: Package
        run: |
          [xml]$project = Get-Content -Raw KillerPDF.csproj
          $version = @($project.Project.PropertyGroup | Where-Object { $_.Version })[0].Version
          $out = Join-Path $PWD 'release'
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item -LiteralPath 'bin/Release/net10.0-windows/publish/KillerPDF-Portable.exe' -Destination $out
          ./build/bundle-source.ps1 -ProjectDir $PWD -Version $version -AppName KillerPDF -PublishDir $out
          if (-not (Test-Path (Join-Path $out "KillerPDF-$version-src.zip"))) { throw 'The GPL source archive was not produced.' }

          # The payload's LICENSE is PDFium's notice; the project's own license is GPLv3.
          Copy-Item -LiteralPath 'bin/Release/net10.0-windows/portable-package/payload/LICENSE' -Destination (Join-Path $out 'PDFium-LICENSE.txt')
          Copy-Item -LiteralPath LICENSE -Destination (Join-Path $out 'LICENSE')

          $lines = Get-ChildItem $out -File | Where-Object Name -NotIn 'LICENSE', 'PDFium-LICENSE.txt' | ForEach-Object {
            "$($_.Name)  $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
          }
          $lines | Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: KillerPDF-release
          path: release/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: KillerPDF ${{ github.event.inputs.tag || github.ref_name }}
          body: |
            ## 辦公文件微調版 / Office refinement

            這是在原開源 KillerPDF 1.8.91 基礎上延續修改的一版，針對台灣辦公文件的閱讀、填寫、簽名與寄回流程調整操作與繁中用語。
            本分支沿用 GNU GPLv3，保留原作者與貢獻者的署名及授權資訊，並提供包含本次修改的對應原始碼與建置方式。
            感謝原專案 [SteveTheKiller/KillerPDF](https://github.com/SteveTheKiller/KillerPDF)；這是衍生微調版，不是上游官方發佈。

            This is a follow-up refinement of KillerPDF 1.8.91 for everyday office documents and Traditional Chinese workflows.
            The fork continues under GNU GPLv3, retains upstream attribution and license notices, and provides corresponding source and build instructions.

            - `KillerPDF-Portable.exe`：單一可攜執行檔，已內含 .NET runtime，下載後直接執行，不需安裝。程式未簽章，第一次執行時 Windows SmartScreen 可能提示。
              Single portable EXE with its own .NET runtime; download and run. It is not code-signed, so SmartScreen may warn on first run.
            - `KillerPDF-*-src.zip`：對應原始碼 / corresponding source. `LICENSE` is the project's GPLv3; `PDFium-LICENSE.txt` is PDFium's notice.
            - 說明見原始碼中的 `OFFICE_UX.md`、`OFFICE_UX_VALIDATION.md` 與 `docs/PORT_FROM_FORK.md`。
            - 程式內的更新檢查仍指向原專案；本分支的更新請從這裡的 Releases 下載。
              The in-app update check still points to the upstream project; take fork updates from this repository's Releases.
          files: |
            release/KillerPDF-Portable.exe
            release/KillerPDF-*-src.zip
            release/SHA256SUMS.txt
            release/LICENSE
            release/PDFium-LICENSE.txt
